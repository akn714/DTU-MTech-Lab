<style>

.s{position:absolute;inset:0;padding:4vh 5vw 10vh;overflow:auto;opacity:0;pointer-events:none;transform:translateZ(-160px) rotateY(6deg);transition:.6s cubic-bezier(.2,.8,.2,1)}
.s.on{opacity:1;pointer-events:auto;transform:none}.s.out{transform:translateZ(-160px) rotateY(-6deg)}

h1,h2{font-weight:700;margin:.1em 0 .3em;text-shadow:0 0 18px rgba(25,240,255,.35);color:var(--cy)}h1{font-size:clamp(2.2rem,6vw,4.6rem);line-height:1.02}h2{font-size:clamp(1.5rem,3vw,2.3rem)}h3{margin:.2em 0;color:var(--yl)}
p,li{max-width:64ch;margin:.35em 0}ul{padding-left:1.1em;margin:.3em 0}.mu{color:var(--mu)}.bad{color:var(--mg)}.ok{color:var(--gn)}.yl{color:var(--yl)}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:10px}
.c,.p{background:var(--pn);border:1px solid var(--ln);border-left:3px solid var(--cy);padding:10px 13px;border-radius:4px;transition:.25s}.c{cursor:pointer}
.c:hover,.c.a{border-color:var(--mg);box-shadow:0 0 22px rgba(255,46,154,.25);transform:translateY(-3px)}.c b{color:var(--yl)}.c .d{display:none;color:var(--mu);font-size:.92rem;margin-top:6px}.c.a .d{display:block}
.btn{background:transparent;color:var(--cy);border:1px solid var(--cy);padding:5px 13px;font:inherit;cursor:pointer;border-radius:3px;margin:3px 4px 3px 0;transition:.2s}.btn:hover,.btn.a{background:var(--cy);color:#000}.btn:focus-visible,.c:focus-visible{outline:2px solid var(--yl)}
.box{background:#0b0919;border:1px solid var(--ln);border-radius:4px;padding:10px;margin-top:8px;font-size:.88rem;word-break:break-all;min-height:44px}
input.in{width:100%;max-width:480px;background:#0b0919;border:1px solid var(--cy);color:var(--tx);padding:7px;font:.9rem 'JetBrains Mono',monospace;border-radius:3px}
.hl{background:rgba(255,46,154,.25);color:var(--mg)}.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}.row>*{flex:1 1 320px;min-width:0}
svg text{fill:var(--tx);font:600 14px Rajdhani}svg .m{font:12px 'JetBrains Mono',monospace}.ic{fill:currentColor}.node{fill:var(--pn);stroke:var(--cy);stroke-width:1.5}
table{border-collapse:collapse;width:100%;font-size:.86rem;margin:6px 0}td,th{border:1px solid var(--ln);padding:5px 8px;text-align:left}th{color:var(--yl)}
.t3d{transform:rotateX(14deg) rotateY(-10deg);transform-style:preserve-3d;display:inline-block}
.dr{stroke-dasharray:400;animation:dr .8s forwards}@keyframes dr{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes pl{50%{opacity:.35;transform:scale(1.4)}}.pls{animation:pl 1.4s infinite;transform-box:fill-box;transform-origin:center;cursor:pointer}
@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}.shk{animation:sh .2s infinite}
.bar{height:14px;background:#0b0919;border:1px solid var(--ln);border-radius:2px;overflow:hidden;margin:3px 0}.bar i{display:block;height:100%;background:var(--cy);transition:width .6s}
.pop{position:relative;background:#0b0919;border:1px solid var(--cy);border-radius:5px;overflow:hidden}.pop .tb{background:#1d1840;padding:3px 10px;font-size:.78rem;color:var(--mu)}.pop .bd{padding:10px;min-height:110px}
#nav{position:fixed;z-index:5;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:10px;align-items:center;justify-content:center}#bar{position:fixed;z-index:5;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--mg),var(--cy));transition:.4s}
.tag{display:inline-block;border:1px solid var(--gn);color:var(--gn);padding:0 8px;border-radius:10px;font-size:.8rem}label{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.chip{border:1px solid var(--ln);background:var(--pn);padding:3px 11px;border-radius:14px;font-size:.92rem;animation:up .5s both}.chip b{color:var(--mg);margin-right:4px}@keyframes up{from{opacity:0;transform:translateY(12px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<div id="bar"></div><div id="deck"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const hx=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(16).padStart(8,'0')};
const ic=(n,x,y,s,c)=>`<g style="color:${c||'#19f0ff'}"><use href="#i-${n}" x="${x}" y="${y}" width="${s}" height="${s}" class="ic"/></g>`;
const cards=a=>'<div class="g">'+a.map(x=>`<div class="c" tabindex="0" onclick="this.classList.toggle('a')"><b>${x[0]}</b><div>${x[1]}</div><div class="d">${x[2]}</div></div>`).join('')+'</div>';
const sw=(ids,k)=>ids.forEach((d,i)=>$(d).className='btn'+(i==k?' a':''));
// ---------- sequence-diagram engine ----------
const SQ={};
function mkseq(id,C){const st={ti:0,df:0,s:0,tm:null};SQ[id]=st;
function draw(T,M){const A=T.actors,w=760,g=w/A.length,cx=i=>g*(i+.5),h=100+M.length*46;let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:880px">`;
A.forEach((a,i)=>{s+=ic(a[1],cx(i)-22,4,44,a[2])+`<text x="${cx(i)}" y="68" text-anchor="middle">${a[0]}</text><line x1="${cx(i)}" y1="76" x2="${cx(i)}" y2="${h-4}" stroke="#2d2557" stroke-dasharray="4 4"/>`});
M.forEach((m,k)=>{if(k>=st.s)return;const y=104+k*46,col={x:'#ff2e9a',b:'#ff2e9a',g:'#35ff9b'}[m[3]]||'#19f0ff',a=cx(m[0]),b=cx(m[1]),nw=k==st.s-1;
if(m[0]==m[1])s+=`<rect x="${a+10}" y="${y-17}" width="${Math.min(330,m[2].length*7.4+16)}" height="26" rx="4" fill="#0b0919" stroke="${col}"/><text class="m" x="${a+18}" y="${y}" style="fill:${col}">${m[2]}</text>`;
else{s+=`<line x1="${a}" y1="${y}" x2="${b}" y2="${y}" stroke="${col}" stroke-width="2.2" marker-end="url(#ar)" ${nw?'class="dr"':''}/><text class="m" x="${(a+b)/2}" y="${y-8}" text-anchor="middle" style="fill:${col}">${m[2]}</text>`;if(nw)s+=`<circle r="6" fill="${col}"><animateMotion dur=".9s" fill="freeze" path="M${a} ${y}L${b} ${y}"/></circle>`;if(m[3]=='x')s+=`<text x="${b}" y="${y+8}" text-anchor="middle" style="fill:#ff2e9a;font-size:24px">✖</text>`}});return s+'</svg>'}
function ui(){const T=C.tabs[st.ti],M=st.df&&T.d?T.d:T.a,cur=M[st.s-1];
$(id).innerHTML=`<div>${C.tabs.map((t,i)=>`<button class="btn${i==st.ti?' a':''}" data-t="${i}">${t.n}</button>`).join('')}</div><div>${T.d?`<button class="btn${st.df?' a':''}" data-d>🛡 ${T.dn||'Defense'}: ${st.df?'ON':'OFF'}</button>`:''}<button class="btn" data-s>Next step ▶</button><button class="btn" data-p>Auto-play</button><button class="btn" data-r>Reset</button></div>${draw(T,M)}<div class="box">${cur?(cur[4]||''):T.c||'Press “Next step” to walk through it.'}</div>`;}
$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;const T=C.tabs[st.ti],M=st.df&&T.d?T.d:T.a;clearInterval(st.tm);
if(b.dataset.t!=null){st.ti=+b.dataset.t;st.s=0;st.df=0}else if('d'in b.dataset){st.df=1-st.df;st.s=0}else if('s'in b.dataset)st.s=Math.min(M.length,st.s+1);else if('r'in b.dataset)st.s=0;
else if('p'in b.dataset){st.s=0;st.tm=setInterval(()=>{if(st.s>=M.length)return clearInterval(st.tm);st.s++;ui()},1500)}ui()};ui()}
const AG=a=>'<div class="chips">'+a.map((x,k)=>`<span class="chip" style="animation-delay:${k*.12}s"><b>${k+1}</b> ${x}</span>`).join('')+'</div>';
const who=(n,r)=>`<div style="display:flex;align-items:center;gap:12px;margin:4px 0"><svg viewBox="0 0 48 48" width="52" height="52">${ic('user',0,0,48,'#ff2e9a')}</svg><div><div style="font-size:1.7rem;font-weight:700;color:#fff">${n}</div><div class="mu">${r}</div></div></div>`;
const P1='Member 1 · Rahul · Web security fundamentals and attacks',P2='Member 2 · Adarsh Kumar · Secure communication and protection',P3='Member 3 · Adarsh Kumar Gupta · Recent trends in cryptosystems';
const S=[];
S.push({p:'',t:'',b:`<div class="row" style="align-items:center;margin-top:6vh"><div><span class="part mono">class presentation</span><h1><span class="t3d">Web Security</span><br>and the Future of Cryptography</h1><p class="mu">How websites get attacked, how HTTPS and good engineering protect them, and why cryptography is being rebuilt for the quantum era.</p><p><span class="tag">Rahul · Attacks</span> <span class="tag">Adarsh Kumar · Protection</span> <span class="tag">Adarsh Kumar Gupta · Cryptosystems</span></p><p class="mu mono">Use → / ← or the buttons. Click everything: most slides are interactive.</p></div>
<svg viewBox="0 0 360 300" width="100%" style="max-width:420px">${ic('shield',120,60,120,'#19f0ff')}${ic('lock',40,170,70,'#ff2e9a')}${ic('key',250,180,70,'#ffd23f')}${ic('hack',260,40,60,'#9b97c9')}<circle cx="180" cy="120" r="100" fill="none" stroke="#2d2557" stroke-dasharray="6 8"><animateTransform attributeName="transform" type="rotate" from="0 180 120" to="360 180 120" dur="24s" repeatCount="indefinite"/></circle><circle cx="180" cy="20" r="6" fill="#19f0ff"><animateTransform attributeName="transform" type="rotate" from="0 180 120" to="360 180 120" dur="8s" repeatCount="indefinite"/></circle></svg></div>`});

S.push({p:P1,t:'Introduction: Web Security Fundamentals and Attacks',b:`<div class="row"><div>${who('Rahul','Member 1 · introduces web security and the attacks on the web')}<ul><li><b>Web security</b> is the practice of protecting websites, web applications, APIs and their users from attack and misuse.</li><li>Every site is reachable by anyone, so every request has to be treated as potentially hostile.</li><li>In this part we see <b>why it matters</b>, <b>how a web request works</b>, and <b>how attackers break in</b>. Member 2 then shows how we stop them.</li></ul></div><div><h3>What we will cover</h3>${AG(['Why web security matters','Goals: the CIA triad','Architecture: where attacks land','Man-in-the-Middle attacks','SQL Injection','Cross-Site Scripting (XSS)','CSRF, Session Hijacking, SSRF','Broken Access Control','Prevention and summary'])}</div></div>`});
S.push({p:P1,t:'Why web security matters',b:`<div class="row"><div><ul><li>Web applications hold passwords, payments and identities, so <b>attackers go there first</b>.</li><li>Even the biggest companies are hit. Click a card to see what actually went wrong.</li></ul><div class="g"><div class="c" tabindex="0" onclick="this.classList.toggle('a')"><b class="mono" style="font-size:1.9rem"><span class="cn" data-v="22">0</span> crore ₹</b><div>Average data breach cost in India, IBM 2025 (up 13%, a record)</div><div class="d">Cost covers investigation, downtime, legal and lost customers.</div></div><div class="c" tabindex="0" onclick="this.classList.toggle('a')"><b class="mono" style="font-size:1.9rem"><span class="cn" data-v="29">0</span> million</b><div>Meta (Facebook), 2018</div><div class="d">Bugs in one profile feature let attackers steal login tokens and access user data.</div></div><div class="c" tabindex="0" onclick="this.classList.toggle('a')"><b class="mono" style="font-size:1.9rem"><span class="cn" data-v="100">0</span> million</b><div>Capital One, 2019</div><div class="d">A misconfigured web application firewall relayed attacker requests to internal cloud resources.</div></div></div></div>
<div><svg viewBox="0 0 400 240" width="100%" style="max-width:440px">${ic('hack',10,80,60,'#ff2e9a')}<path d="M80 110H200" stroke="#ff2e9a" stroke-width="2" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="22;0" dur="1s" repeatCount="indefinite"/></path>${ic('server',210,70,80,'#19f0ff')}${ic('user',330,90,24,'#9b97c9')}${ic('user',360,90,24,'#9b97c9')}${ic('user',330,120,24,'#9b97c9')}${ic('user',360,120,24,'#9b97c9')}<circle r="5" fill="#ffd23f"><animateMotion dur="1.8s" repeatCount="indefinite" path="M290 110L340 105"/></circle><circle r="5" fill="#ffd23f"><animateMotion dur="1.8s" begin=".6s" repeatCount="indefinite" path="M290 110L370 130"/></circle><text x="210" y="175" class="m">data leaving the app</text><text class="m" x="10" y="210">Breach size (millions of users)</text><rect x="10" y="218" width="${29*3}" height="10" fill="#19f0ff"/><rect x="10" y="232" width="${100*3}" height="10" fill="#ff2e9a"/><text class="m" x="${29*3+16}" y="227">Meta 29</text><text class="m" x="${100*3+16}" y="241">Capital One 100</text></svg><p class="box"><b class="yl">Key point:</b> both breaches were application-layer flaws, not network interception. HTTPS alone would not have prevented them.</p></div></div>`,i(){document.querySelectorAll('.cn').forEach(e=>{const v=+e.dataset.v;let t=0;const id=setInterval(()=>{t+=.04;e.textContent=Math.round(v*(1-Math.pow(1-Math.min(t,1),3)));if(t>=1)clearInterval(id)},30)})}});
S.push({p:P1,t:'The goals of web security: the CIA triad',b:`<div class="row"><div><ul><li><b>Web security</b> = protecting websites, web apps, APIs and their users from misuse.</li><li>The web is open by design: anyone can send a request, so every input is untrusted.</li><li>Goals follow the <b>CIA triad</b>: keep secrets (Confidentiality), keep data correct (Integrity), keep the service up (Availability).</li><li>Impact of failure: stolen accounts, money loss, legal penalties, lost trust.</li></ul></div><div class="p"><h3>Try the three goals</h3><b>Confidentiality</b> <label><input type="checkbox" id="cE" onchange="cia()"> encrypt</label><div class="box mono" id="cO"></div><b>Integrity</b> – change the amount: <input class="in" style="width:90px" id="iA" value="100" oninput="cia()"><div class="box mono" id="iO"></div><b>Availability</b> – requests/sec: <input type="range" id="aR" min="0" max="1000" value="200" oninput="cia()" style="width:60%"><div class="box" id="aO"></div></div></div>`,i(){cia()}});
function cia(){const t='card 4111 1111';$('cO').innerHTML=$('cE').checked?`<span class=ok>${[...t].map(c=>hx(c+'k').slice(0,2)).join('')}</span> (attacker sees only this)`:`<span class=bad>${t}</span> (attacker reads it)`;const a=$('iA').value;$('iO').innerHTML=`Stored hash of "100": ${hx('100')}<br>Hash of "${esc(a)}": ${hx(a)} ${hx(a)==hx('100')?'<span class=ok>✔ unchanged</span>':'<span class=bad>✖ tampered, detected</span>'}`;const r=+$('aR').value,o=r>600;$('aO').innerHTML=`<svg viewBox="0 0 300 54" width="100%" style="max-width:300px">${ic('server',4,2,46,o?'#ff2e9a':'#35ff9b')}<g class="${o?'shk':''}"></g></svg><div class="bar"><i style="width:${Math.min(100,r/10)}%;background:${o?'#ff2e9a':'#35ff9b'}"></i></div>${o?'<span class=bad>Capacity is 600 req/s: server overloaded (DDoS effect)</span>':'<span class=ok>Server healthy</span>'}`}

S.push({p:P1,t:'Architecture: one web request, six places to attack',b:`<p class="mu">Click a numbered marker, or tour all six. The browser asks DNS, opens TCP, sends HTTP, the app runs code, the code queries the database.</p><svg viewBox="0 0 840 250" width="100%" style="max-width:960px"><path d="M70 120H770" stroke="#2d2557" stroke-width="3"/>${[['browser','Client'],['shield','Local network'],['doc','DNS'],['cloud','TCP + HTTP path'],['server','Web server / app'],['db','Database']].map((n,k)=>{const x=70+k*140;return ic(n[0],x-30,90,60,k==5?'#ffd23f':'#19f0ff')+`<text x="${x}" y="195" text-anchor="middle">${n[1]}</text><g id="mk${k}" onclick="mk(${k})" style="cursor:pointer"><circle class="pls" cx="${x}" cy="60" r="15" fill="#ff2e9a"/><text x="${x}" y="66" text-anchor="middle" style="fill:#fff;font-size:17px">${k+1}</text></g>`}).join('')}<circle r="7" fill="#35ff9b"><animateMotion dur="5s" repeatCount="indefinite" path="M70 120H770"/></circle></svg>
<div class="box" id="amo" style="font-size:1rem">Request path: client → local network → DNS → path → server/app → database.</div><button class="btn" onclick="tour()">Tour the six markers ▶</button>`});
const MK=['<b>Client</b>: malware on the device can read everything the browser sees.','<b>Local network</b>: ARP spoofing and fake Wi-Fi let an attacker sit in the middle.','<b>DNS</b>: answers can be forged to send you to the wrong server.','<b>Path</b>: anyone on the route can intercept traffic that is not encrypted.','<b>Server/app</b>: the code itself can be flawed (injection, broken access control).','<b>Database</b>: holds the prize, reached through the app.'];
function mk(k){$('amo').innerHTML='<span class=bad>⚠ '+(k+1)+'.</span> '+MK[k]}let tt;function tour(){clearInterval(tt);let k=0;mk(0);tt=setInterval(()=>{if(++k>5)return clearInterval(tt);mk(k)},2200)}

S.push({p:P1,t:'Man-in-the-Middle attacks and their defenses',b:`<p>The attacker sits between victim and server. Pick an attack, step through it, then switch the defense on.</p><div id="sq0"></div><div class="g"><div class="p" style="border-left-color:#35ff9b"><b class="ok">Defenses</b><br><b>HSTS</b>: browser must always use HTTPS for the site.<br><b>Preload lists</b>: protect even the first visit.<br><b>Strict certificate validation</b>: fake certificates are rejected.</div><div class="c" tabindex="0" onclick="this.classList.toggle('a')"><b>The HSTS gap</b><div>The very first request is usually plain HTTP.</div><div class="d">An attacker can intercept it before any redirect or HSTS header arrives. HSTS only helps after the first secure visit, or if the domain is preloaded.</div></div><div class="c" tabindex="0" onclick="this.classList.toggle('a')"><b>Google, 2011</b><div>A fake certificate for Google was issued.</div><div class="d">Attackers got a certificate authority (DigiNotar) to issue it and used it to spy on Gmail users in Iran. This pushed Certificate Transparency and certificate pinning.</div></div></div>`,i(){if(!$('sq0').innerHTML)mkseq('sq0',{tabs:[
{n:'ARP spoofing',dn:'Dynamic ARP Inspection',actors:[['Victim laptop','user'],['Attacker','hack','#ff2e9a'],['Gateway','server']],a:[[1,0,'fake ARP: gateway is at attacker MAC','b','On a local network the attacker sends forged ARP replies.'],[0,1,'victim traffic goes to attacker','b','The laptop now believes the attacker is the gateway.'],[1,2,'relays traffic onward',0,'Everything still works, so the victim notices nothing.'],[1,1,'reads / modifies all plain traffic','b','Only possible inside the same LAN or Wi-Fi segment.']],d:[[1,0,'fake ARP reply','x','Switch drops ARP replies that do not match the trusted binding table. Port security limits rogue devices.'],[0,2,'traffic goes straight to real gateway','g','Attack fails.']]},
{n:'Rogue Wi-Fi',dn:'HTTPS everywhere / VPN',actors:[['Victim','user'],['Fake access point','hack','#ff2e9a'],['Website','server']],a:[[0,1,'joins “Free_Airport_WiFi”','b','The attacker runs an access point with a familiar name.'],[0,1,'all traffic passes through it','b','The victim is connected and sees nothing odd.'],[1,2,'relays requests',0,''],[1,1,'sees every plain request and cookie','b','Everything over HTTP is readable.']],d:[[0,1,'joins “Free_Airport_WiFi”',0,'Same fake network.'],[0,2,'TLS-encrypted traffic (HTTPS / VPN)','g','Traffic is encrypted end to end.'],[1,1,'sees only ciphertext','x','The rogue AP gains nothing.']]},
{n:'SSL stripping',dn:'HSTS (+ preload)',actors:[['Victim','user'],['Attacker','hack','#ff2e9a'],['Bank server','bank','#ffd23f']],a:[[0,1,'http://bank.com (first request)','b','The first request is plain HTTP.'],[1,2,'https://bank.com',0,'Attacker speaks HTTPS to the server.'],[2,1,'secure page',0,''],[1,0,'same page over HTTP, links rewritten','b','The victim never sees the padlock disappear.'],[0,1,'password over HTTP','b','Typed into a plain connection.'],[1,1,'attacker reads the password','b','Downgrade succeeded.']],d:[[0,0,'browser knows bank.com is on the HSTS preload list',0,'Even the first visit is protected.'],[0,2,'https://bank.com directly','g','Request never goes out as HTTP.'],[1,1,'nothing to strip','x','Attack blocked.']]}]})}});
S.push({p:P1,t:'SQL Injection (SQLi)',b:`<p class="bad"><b>HTTPS does not fix application flaws</b>: the attacker connects over TLS too.</p><div class="row"><div><ul><li>Attacker input is concatenated into a SQL string, so it becomes <b>code</b>.</li><li>Impact: log in without a password, dump tables, even delete data.</li><li>Try: <span class="mono bad">' OR '1'='1</span> &nbsp; <span class="mono bad">admin'--</span> &nbsp; <span class="mono bad">'; DROP TABLE users;--</span></li></ul><div class="pop"><div class="tb">Login form</div><div class="bd">Username: <input id="sq" class="in" value="' OR '1'='1" oninput="sqi()"><div style="margin-top:8px"><button class="btn a" id="sb1" onclick="sqm(0)">String concatenation</button><button class="btn" id="sb2" onclick="sqm(1)">Parameterized query</button></div></div></div><div class="box mono" id="sqo"></div></div><div><div class="p" id="sqt"></div><p id="sqr"></p></div></div>`,i(){window.sqmode=0;sqi()}});
const U=[['admin','9f2c…','root'],['ali','b41a…','user'],['sara','77de…','user'],['raj','c03f…','user']];
function sqm(m){sqmode=m;sw(['sb1','sb2'],m);sqi()}
function sqi(){const v=$('sq').value,e=esc(v),inj=/'/.test(v),all=/'\s*or\s*'?1'?\s*=\s*'?1/i.test(v),drop=/drop\s+table/i.test(v),cm=/--/.test(v);let hit=[],msg='';
if(sqmode){$('sqo').innerHTML=`SELECT * FROM users WHERE name = ?<br>param = <span class=ok>"${e}"</span>`;hit=U.filter(u=>u[0]==v);msg='<span class=ok>The value is bound as data. It can only match a user with that exact name.</span>'}
else{$('sqo').innerHTML=`SELECT * FROM users WHERE name = '${inj?`<span class=hl>${e}</span>`:e}'`;if(all){hit=U;msg='<span class=bad>Condition is always true: the whole table leaks.</span>'}else if(/^admin'/i.test(v)&&cm){hit=[U[0]];msg='<span class=bad>Comment (--) cuts off the password check: logged in as admin.</span>'}else{hit=U.filter(u=>u[0]==v);msg=drop?'<span class=bad>Stacked query drops the table: data destroyed.</span>':inj?'<span class=bad>Quote breaks out of the string.</span>':'<span class=ok>Normal lookup.</span>'}}
$('sqt').innerHTML=`<svg viewBox="0 0 60 30" width="60">${ic('db',0,0,30,'#ffd23f')}</svg> <b>users</b> table ${drop&&!sqmode?'<span class=bad>(DROPPED)</span>':''}<table style="${drop&&!sqmode?'opacity:.2;text-decoration:line-through':''}"><tr><th>name</th><th>password hash</th><th>role</th></tr>${U.map(u=>`<tr style="${hit.includes(u)?'background:rgba(255,46,154,.25)':''}"><td>${u[0]}</td><td>${u[1]}</td><td>${u[2]}</td></tr>`).join('')}</table><span class=mu>Rows returned to the attacker are highlighted.</span>`;$('sqr').innerHTML=msg}

S.push({p:P1,t:'Cross-Site Scripting (XSS)',b:`<div class="row"><div><ul><li>The site shows user input as HTML, so attacker <b>JavaScript runs inside the victim's browser</b>.</li><li><b>Stored</b>: saved in a comment. <b>Reflected</b>: bounced from a URL. <b>DOM-based</b>: client-side JS inserts it.</li><li>Script can read cookies, act as the user, or rewrite the page.</li></ul>Post a comment: <input id="xi" class="in" value="<img src=x onerror=steal(document.cookie)>" oninput="xs()"><div><button class="btn a" id="xb1" onclick="xm(0)">No output encoding</button><button class="btn" id="xb2" onclick="xm(1)">Output encoded</button></div><p id="xr"></p></div>
<div><div class="pop"><div class="tb">🔒 shop.com/comments</div><div class="bd"><b>Comments</b><div id="xo" class="mono"></div></div></div><svg viewBox="0 0 400 90" width="100%" id="xsv"></svg></div></div></div>`,i(){window.xmode=0;xs()}});
function xm(m){xmode=m;sw(['xb1','xb2'],m);xs()}
function xs(){const v=$('xi').value,bad=/<[^>]*on\w+\s*=|<script|javascript:/i.test(v);$('xo').innerHTML=xmode?`<span class=ok>${esc(v)}</span>`:(bad?`<span class=bad>[script executes]</span>`:esc(v));
$('xr').innerHTML=xmode?'<span class=ok>Characters &lt; &gt; are encoded, so the browser shows text and never runs it.</span>':bad?'<span class=bad>Script runs for every visitor.</span>':'<span class=ok>Harmless text.</span>';
$('xsv').innerHTML=!xmode&&bad?`${ic('browser',10,20,50)}${ic('cookie',100,25,34,'#ffd23f')}${ic('hack',330,20,50,'#ff2e9a')}<path d="M70 45H330" stroke="#ff2e9a" stroke-dasharray="5 5" marker-end="url(#ar)"/><text class="m" x="130" y="35" style="fill:#ff2e9a">sid=abc123 → attacker.com</text><circle r="7" fill="#ffd23f"><animateMotion dur="1.6s" repeatCount="indefinite" path="M70 45H330"/></circle>`:`${ic('browser',10,20,50)}${ic('shield',330,20,50,'#35ff9b')}<text class="m" x="100" y="50" style="fill:#35ff9b">nothing leaves the browser</text>`}

S.push({p:P1,t:'CSRF, Session Hijacking and SSRF: step through each attack',b:`<p class="mu">Pick an attack, press Next step, then switch the defense on to see where it breaks.</p><div id="sq1"></div>`,i(){if(!$('sq1').innerHTML)mkseq('sq1',{tabs:[
{n:'CSRF',dn:'CSRF token + SameSite',actors:[['Victim browser','browser'],['evil.com','hack','#ff2e9a'],['bank.com','bank','#ffd23f']],
a:[[0,2,'login (cookie set)',0,'Victim logs in to the bank; the browser stores the session cookie.'],[0,1,'visits evil.com',0,'Later the victim opens a malicious page in another tab.'],[1,0,'hidden form → bank',3,'The page auto-submits a form aimed at bank.com.'],[0,2,'POST /transfer + cookie','b','The browser attaches the bank cookie automatically.'],[2,2,'valid cookie → money sent','b','The bank cannot tell the request was forged. Attack succeeds.']],
d:[[0,2,'login (cookie SameSite=Lax)',0,'Cookie is marked SameSite and the bank also issues a secret CSRF token inside its own forms.'],[0,1,'visits evil.com',0,''],[0,2,'POST /transfer (no cookie, no token)','x','Cross-site POST does not carry the cookie and the attacker cannot know the token.'],[2,2,'403 request rejected','g','Forged request blocked.']]},
{n:'Session hijack',dn:'HTTPS + HttpOnly cookie',actors:[['User','user'],['Server','server'],['Attacker','hack','#ff2e9a']],
a:[[0,1,'login',0,'User authenticates.'],[1,0,'Set-Cookie: sid=9f31c',0,'Server gives a session ID: the key to the account.'],[0,2,'(sid leaks: sniffed or via XSS)','b','Cookie travels over plain HTTP or is read by injected script.'],[2,1,'GET /account  Cookie: sid=9f31c','b','Attacker replays the stolen ID.'],[1,1,'treats attacker as the user','b','No password needed. Account taken over.']],
d:[[0,1,'login over HTTPS',0,'Traffic is encrypted, nothing to sniff.'],[1,0,'Set-Cookie: sid; Secure; HttpOnly',0,'JavaScript cannot read the cookie; it never goes over HTTP.'],[0,2,'sniff / XSS read cookie','x','Attacker gets nothing useful.'],[1,1,'new sid issued at each login','g','Session rotation limits fixation and replay.']]},
{n:'SSRF',dn:'Allow-list + block internal IPs',actors:[['Attacker','hack','#ff2e9a'],['Web app','server'],['Cloud metadata','cloud','#ffd23f']],
a:[[0,1,'POST /preview url=http://169.254.169.254/',0,'App has a “fetch this URL” feature. Attacker supplies an internal address.'],[1,2,'GET /latest/meta-data/iam/…','b','The server, which sits inside the network, makes the request.'],[2,1,'temporary cloud credentials','b','Internal service trusts the server.'],[1,0,'returns the response to attacker','b','Secrets leak. Attacker can pivot deeper.']],
d:[[0,1,'POST /preview url=http://169.254.169.254/',0,'Same malicious URL.'],[1,1,'resolve host → internal IP','x','App only allows listed public domains and rejects private/link-local IPs.'],[1,0,'400 blocked','g','Request never leaves the app.']]}]})}});

S.push({p:P1,t:'Broken Access Control (IDOR)',b:`<div class="row"><div><ul><li>Authentication = who you are. <b>Authorization</b> = what you may do. Broken access control means the second check is missing.</li><li>Classic bug: <b>IDOR</b>, changing an ID in the URL to read someone else's record.</li><li>Also: reaching /admin as a normal user, editing other users' data.</li></ul>You are logged in as <b class="yl">ali</b> (owns orders 1001, 1002). Open order: <input type="range" id="oi" min="1001" max="1006" value="1001" oninput="ido()" style="width:200px"> <span id="oid" class="mono"></span><div><button class="btn" id="ib1" onclick="idm=0;ido()">Server checks nothing</button><button class="btn a" id="ib2" onclick="idm=1;ido()">Server checks owner</button></div></div><div><svg viewBox="0 0 420 150" width="100%" id="isv"></svg><div class="box" id="iot"></div></div></div>`,i(){window.idm=0;ido()}});
const O={1001:['ali','Laptop',1299],1002:['ali','Mouse',29],1003:['sara','Phone',899],1004:['raj','Headphones',199],1005:['sara','Camera',650],1006:['raj','Watch',320]};
function ido(){const k=$('oi').value,o=O[k],own=o[0]=='ali';$('oid').textContent='/orders/'+k;sw(['ib1','ib2'],idm);const ok=own||!idm;
$('isv').innerHTML=`${ic('user',10,40,56,'#19f0ff')}<text x="10" y="120">ali</text><path d="M80 70H300" stroke="${ok&&!own?'#ff2e9a':'#19f0ff'}" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="6 5"/><circle r="6" fill="#19f0ff"><animateMotion dur="1.4s" repeatCount="indefinite" path="M80 70H300"/></circle>${ic(ok?'doc':'lock',320,40,60,ok?(own?'#35ff9b':'#ff2e9a'):'#ffd23f')}<text x="310" y="120">order ${k}</text>`;
$('iot').innerHTML=ok?(own?`<span class=ok>Your order: ${o[1]}, $${o[2]}</span>`:`<span class=bad>Leaked: ${o[0]}'s order (${o[1]}, $${o[2]}). Any user can read any order.</span>`):'<span class=ok>403 Forbidden: the server verified this order belongs to someone else.</span>'}

S.push({p:P1,t:'Prevention and summary: defense in depth',b:`<div class="row"><div><p class="mu">Click a ring. Attackers must break every layer to reach the data.</p><svg viewBox="0 0 360 360" width="100%" style="max-width:380px"><g id="rg"></g>${ic('db',150,150,60,'#ffd23f')}</svg><div class="box" id="rO">Layers protect each other: a failure in one is caught by the next.</div></div><div><table><tr><th>Threat</th><th>Core defence</th></tr><tr><td>SQLi</td><td>Parameterized queries, least-privilege DB user</td></tr><tr><td>XSS</td><td>Output encoding, CSP, sanitize HTML</td></tr><tr><td>CSRF</td><td>Anti-CSRF tokens, SameSite cookies</td></tr><tr><td>Session hijacking</td><td>HTTPS, HttpOnly/Secure, rotate IDs</td></tr><tr><td>Broken access control</td><td>Deny by default, server-side checks</td></tr><tr><td>SSRF</td><td>URL allow-list, block internal IPs</td></tr></table><p class="ok"><b>Summary:</b> never trust client input, check permissions on the server, encrypt in transit, log and monitor.</p></div></div>`,i(){const L=[['Network: HTTPS, WAF, rate limits','#9b97c9'],['Input validation + output encoding','#19f0ff'],['Authentication + authorization','#ff2e9a'],['Secure sessions + cookies','#35ff9b'],['Least privilege + DB hardening','#ffd23f']];$('rg').innerHTML=L.map((l,k)=>{const r=170-k*28;return `<circle cx="180" cy="180" r="${r}" fill="${k==4?'#120f26':'none'}" stroke="${l[1]}" stroke-width="3" style="cursor:pointer" onclick="$('rO').innerHTML='<b style=color:${l[1]}>Layer ${k+1}:</b> ${l[0]}'"><animate attributeName="stroke-opacity" values="1;.4;1" dur="${3+k*.5}s" repeatCount="indefinite"/></circle>`}).join('')}});
S.push({p:P2,t:'Introduction: how these attacks are stopped',b:`<div class="row"><div>${who('Adarsh Kumar','Member 2 · secure web communication and protection')}<p><b>Recap from Member 1:</b> the web is attacked in the network (eavesdropping, man-in-the-middle) and in the application (SQL injection, XSS, CSRF, session hijacking, broken access control, SSRF).</p><p><b>This part:</b> the defenses. Click a green defense to see which attacks it stops.</p></div><div><h3>What we will cover</h3>${AG(['HTTP vs HTTPS','SSL and TLS, certificates','TLS handshake: 1.2 vs 1.3','What HTTPS protects, and its limits','Secure sessions, cookies, headers','CSP, input validation, safe queries','OWASP Top 10:2025','Securing an e-commerce application'])}</div></div>
<svg viewBox="0 0 760 330" width="100%" style="max-width:900px" id="rcp"></svg>`,i(){rcp(-1)}});
const RA=['Eavesdropping / MITM','SQL injection','XSS','CSRF','Session hijacking','Broken access control','SSRF'],RD=[['HTTPS + TLS + HSTS',[0,4]],['Parameterized queries + validation',[1]],['CSP + output encoding',[2]],['SameSite cookies + CSRF tokens',[3]],['Secure / HttpOnly cookies',[4]],['Server-side authorization',[5]],['URL allow-list, block internal IPs',[6]]];
function rcp(h){const y=k=>20+k*44;let s='';RD.forEach((d,j)=>d[1].forEach(a=>{const on=h==j;s+=`<path d="M230 ${y(a)+16}C360 ${y(a)+16} 400 ${y(j)+16} 530 ${y(j)+16}" fill="none" stroke="${on?'#35ff9b':'#2d2557'}" stroke-width="${on?3:1.5}"${on?' stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" values="20;0" dur=".8s" repeatCount="indefinite"/></path>':'/>'}`}));
RA.forEach((a,k)=>{const hit=h>=0&&RD[h][1].includes(k);s+=`<rect x="10" y="${y(k)}" width="220" height="32" rx="5" fill="#120f26" stroke="${hit?'#ff2e9a':'#2d2557'}" stroke-width="${hit?3:1.5}"/><text x="22" y="${y(k)+21}" style="fill:#ff2e9a">${a}</text>`});
RD.forEach((d,j)=>{s+=`<g onclick="rcp(${j})" style="cursor:pointer"><rect x="530" y="${y(j)}" width="225" height="32" rx="5" fill="${h==j?'#0e3a2a':'#120f26'}" stroke="#35ff9b" stroke-width="${h==j?3:1.5}"/><text x="540" y="${y(j)+21}" style="fill:#35ff9b;font-size:12.5px">${d[0]}</text></g>`});
$('rcp').innerHTML=s+'<text x="10" y="326" class="m" style="fill:#9b97c9">Attacks (Member 1)</text><text x="530" y="326" class="m" style="fill:#9b97c9">Defenses (Member 2)</text>'}
S.push({p:P2,t:'HTTP vs HTTPS: everything in the clear vs an encrypted tunnel',b:`<div class="row"><div><ul><li><b>HTTP</b> sends URLs, form fields, passwords, cookies and headers in the clear. Anyone on the path (the “man in the middle”) can read them, e.g. on public Wi-Fi.</li><li><b>Basic Authentication</b> is only Base64: encoding, not encryption.</li><li>The worst leak is the <b>session cookie</b>: steal it and you become the user, no password needed. <b>Firesheep</b> (2010) made this one click on open Wi-Fi.</li><li>HTTP gives no secrecy, no integrity and no proof of server identity.</li><li><b>HTTPS</b> = HTTP carried inside an encrypted TLS tunnel.</li></ul><div class="p"><b>Base64 is not secret.</b> Type credentials:<input id="b6" class="in" value="ali:hunter2" oninput="b64()"><div class="box mono" id="b6o"></div></div></div>
<div><button class="btn a" id="hp1" onclick="hpk(0)">HTTP</button><button class="btn" id="hp2" onclick="hpk(1)">HTTPS (HTTP inside TLS)</button><div class="pop"><div class="tb">What a sniffer on the same Wi-Fi captures <span class="mu">(illustrative)</span></div><div class="bd mono" id="hpo" style="font-size:.82rem;line-height:1.6"></div></div><p id="hpm"></p></div></div>
<h3>What an eavesdropper sees: step through it</h3><div id="sq2"></div>
<h3>HTTPS gives three properties (delivered by TLS, next slides)</h3><div class="g"><div class="p"><b class="ok">Confidentiality</b><br>An eavesdropper sees only ciphertext.</div><div class="p"><b class="ok">Integrity</b><br>Changed data is detected.</div><div class="p"><b class="ok">Authentication</b><br>A certificate shows which server you reached.</div></div>`,i(){hpk(0);b64();if(!$('sq2').innerHTML)mkseq('sq2',{tabs:[
{n:'HTTP',actors:[['Your browser','browser'],['Café Wi-Fi attacker','hack','#ff2e9a'],['Website','server']],a:[[0,2,'POST /login user=ali&pass=hunter2',0,'Plain text request goes through the attacker\'s network.'],[1,1,'captured: pass=hunter2','b','The attacker reads (or edits) it. No effort needed.'],[2,0,'200 OK (page)',0,'The page also returns in plain text and can be modified in transit.']]},
{n:'HTTPS',actors:[['Your browser','browser'],['Café Wi-Fi attacker','hack','#ff2e9a'],['Website','server']],a:[[0,2,'a9f3 77c1 0be2 5d90 (ciphertext)','g','Browser and site first agreed a key with TLS. Traffic is encrypted.'],[1,1,'captured: 🔒 noise only','x','The attacker sees only random bytes, plus which domain you contact.'],[2,0,'e41b 2c88 f07a (ciphertext)','g','Any modification would be detected by the integrity check.']]}]})}});
function b64(){let v=$('b6').value,e='';try{e=btoa(v)}catch(x){e='(ASCII only)'}$('b6o').innerHTML=`Authorization: Basic <span class=hl>${esc(e)}</span><br>Anyone decodes it: <span class=bad>${esc(v)}</span>`}
function hpk(m){sw(['hp1','hp2'],m);const L=['GET /account HTTP/1.1','Host: shop.example','Authorization: Basic YWxpOmh1bnRlcjI=','Cookie: sid=9f31c7a2','','user=ali&amp;password=hunter2'];$('hpo').innerHTML=L.map((l,k)=>m?`<span class=mu>${l?hx(l+k)+hx(l+'z'+k)+hx(l+'q'):''}</span>`:(k==3||k==5?`<span class=hl>${l}</span>`:l)).join('<br>');$('hpm').innerHTML=m?'<span class=ok>Only ciphertext is visible. The cookie and password stay secret and tampering is detected.</span>':'<span class=bad>Cookie and password are highlighted: readable and reusable by anyone on the path.</span>'}

S.push({p:P2,t:'SSL and TLS: three guarantees and the chain of trust',b:`<div class="row"><div><ul><li><b>SSL</b> (v2, v3) is obsolete and broken. <b>TLS</b> is its successor: 1.0 and 1.1 deprecated, 1.2 (2008) and 1.3 (2018) in use.</li><li>TLS gives: <b>Confidentiality</b> (encryption), <b>Authentication</b> (certificate proves the server), <b>Integrity</b> (tampering is detected).</li><li>Why trust a certificate? It is signed by a CA your browser already trusts. Click Verify.</li></ul><svg viewBox="0 0 360 90" width="100%" style="max-width:380px">${ic('lock',10,10,56)}<text x="2" y="84">encrypt</text>${ic('shield',140,10,56,'#35ff9b')}<text x="125" y="84">authenticate</text>${ic('doc',270,10,56,'#ffd23f')}<text x="262" y="84">integrity</text></svg></div>
<div><svg viewBox="0 0 380 260" width="100%" style="max-width:420px" id="cs"></svg><button class="btn" onclick="cv()">Verify chain ▶</button></div></div>`,i(){cv(1)}});
function cv(r){const L=[['Root CA (in your browser/OS)',20,'#ffd23f'],['Intermediate CA',100,'#19f0ff'],['example.com certificate',180,'#35ff9b']];$('cs').innerHTML=L.map((l,k)=>`${ic('doc',20,l[1],50,l[2])}<text x="85" y="${l[1]+30}">${l[0]}</text>${k<2?`<path d="M45 ${l[1]+52}V${l[1]+78}" stroke="#2d2557" stroke-width="2" marker-end="url(#ar)"/><text class="m" x="55" y="${l[1]+70}" style="fill:#9b97c9">signs</text>`:''}<text id="ck${k}" x="330" y="${l[1]+34}" style="font-size:22px;fill:#35ff9b"></text>`).join('');if(!r)[0,1,2].forEach(k=>setTimeout(()=>{const e=$('ck'+(2-k));if(e)e.textContent='✔'},500*(k+1)))}

S.push({p:P2,t:'The TLS handshake, TLS 1.2 vs TLS 1.3',b:`<div class="row"><div><ul><li>Goal: agree on <b>shared session keys</b> without ever sending the key.</li><li>Browser and server each contribute a key share (Diffie-Hellman); only the final secret is common, an eavesdropper cannot compute it.</li><li>Certificate proves the server is genuine; then symmetric encryption (AES / ChaCha20) protects the data.</li></ul>
<h3>Round trips before data</h3><div class="mono">TLS 1.2 <div class="bar"><i style="width:100%;background:#ff2e9a"></i></div>2 RTT<br>TLS 1.3 <div class="bar"><i style="width:50%;background:#35ff9b"></i></div>1 RTT (0-RTT on resume)</div></div><div id="sq3"></div></div>
<table><tr><th></th><th>TLS 1.2</th><th>TLS 1.3</th></tr><tr><td>Handshake</td><td>2 round trips</td><td>1 round trip</td></tr><tr><td>Key exchange</td><td>RSA or (EC)DHE</td><td>Only (EC)DHE: forward secrecy always</td></tr><tr><td>Ciphers</td><td>Many, some weak (RC4, CBC, SHA-1)</td><td>Only AEAD (AES-GCM, ChaCha20)</td></tr><tr><td>Encrypted handshake</td><td>Certificate visible</td><td>Most of handshake encrypted</td></tr></table>`,i(){if(!$('sq3').innerHTML)mkseq('sq3',{tabs:[
{n:'TLS 1.2',actors:[['Client','browser'],['Server','server']],a:[[0,1,'ClientHello: versions, ciphers, random',0,'Client lists what it supports.'],[1,0,'ServerHello + Certificate + key share',0,'Server picks a cipher and proves its identity.'],[0,1,'ClientKeyExchange + Finished',0,'Client sends its key share; both derive the session key. Round trip 2 begins.'],[1,0,'Finished','g','Handshake verified.'],[0,1,'🔒 encrypted application data','g','Data finally flows.']]},
{n:'TLS 1.3',actors:[['Client','browser'],['Server','server']],a:[[0,1,'ClientHello + key share (guesses cipher)',0,'Client sends its key share immediately.'],[1,0,'ServerHello + share + cert + Finished (encrypted)','g','Server answers once: keys are ready and the rest is already encrypted.'],[0,1,'🔒 Finished + encrypted data','g','Data flows after one round trip.']]}]})}});

S.push({p:P2,t:'How HTTPS protects, and what it cannot do',b:`<div class="row"><div><h3 class="ok">Protects</h3><ul><li>Passwords and cards cannot be sniffed on the network.</li><li>Pages cannot be silently altered (ads, malware injection).</li><li>You reach the real domain: certificate checked.</li><li>Required by browsers for many modern features.</li></ul></div><div><h3 class="bad">Does not protect</h3><ul><li>SQLi, XSS, CSRF: the attacker connects over HTTPS too.</li><li>Phishing sites can have valid certificates.</li><li>A compromised server or malware on your device.</li><li>Metadata: domain names, timing and sizes.</li></ul></div></div><p class="mu">Click an attack to test whether HTTPS stops it.</p><div class="g" id="hq"></div><div class="box" id="hqo">Pick an attack.</div>`,i(){const A=[['Eavesdropping on Wi-Fi',1,'Encrypted traffic is unreadable.'],['Man-in-the-middle page edit',1,'Integrity check fails, connection rejected.'],['SQL injection',0,'The payload is inside the encrypted tunnel but the server still executes it.'],['XSS in a comment',0,'HTTPS delivers the malicious script safely too.'],['Phishing site with a lock icon',0,'Lock only means “encrypted to this domain”, not “honest”.']];$('hq').innerHTML=A.map((a,k)=>`<div class="c" tabindex="0" onclick="$('hqo').innerHTML='${a[1]?'<span class=ok>✔ Stopped.</span>':'<span class=bad>✖ Not stopped.</span>'} ${a[2]}'"><b>${a[0]}</b></div>`).join('')}});

S.push({p:P2,t:'Secure sessions and cookies: toggle the flags',b:`<div class="row"><div><ul><li>A session cookie is the user's key after login: protect it like a password.</li><li><b>Secure</b>: only over HTTPS. <b>HttpOnly</b>: invisible to JavaScript. <b>SameSite</b>: not sent on cross-site requests. <b>HSTS</b> header: force HTTPS always. Also set short lifetimes and rotate IDs.</li></ul><div id="ck" class="p mono" style="font-size:.85rem"></div><label><input type="checkbox" id="f1" onchange="ckf()"> Secure</label> &nbsp;<label><input type="checkbox" id="f2" onchange="ckf()"> HttpOnly</label> &nbsp;<label><input type="checkbox" id="f3" onchange="ckf()"> SameSite=Lax</label> &nbsp;<label><input type="checkbox" id="f4" onchange="ckf()"> HSTS</label> &nbsp;<label><input type="checkbox" id="f5" onchange="ckf()"> X-Frame-Options / frame-ancestors</label></div><div><table id="ct2"></table></div></div>`,i(){ckf()}});
function ckf(){const f=[1,2,3,4,5].map(i=>$('f'+i).checked);$('ck').innerHTML='Set-Cookie: sid=9f31c'+(f[0]?'; <span class=ok>Secure</span>':'')+(f[1]?'; <span class=ok>HttpOnly</span>':'')+(f[2]?'; <span class=ok>SameSite=Lax</span>':'')+(f[3]?'<br>Strict-Transport-Security: max-age=31536000':'')+(f[4]?'<br>Content-Security-Policy: frame-ancestors \'none\'':'');
const R=[['Cookie sent over HTTP (sniffing)',f[0]||f[3]],['Script reads cookie (XSS theft)',f[1]],['Cross-site forged request (CSRF)',f[2]],['Downgrade to HTTP (SSL strip)',f[3]],['Page framed by attacker (clickjacking)',f[4]]];$('ct2').innerHTML='<tr><th>Attack</th><th>Status</th></tr>'+R.map(r=>`<tr><td>${r[0]}</td><td>${r[1]?'<span class=ok>✔ blocked</span>':'<span class=bad>✖ vulnerable</span>'}</td></tr>`).join('')}

S.push({p:P2,t:'CSP, security headers, input validation and parameterized queries',b:`<div class="row"><div class="p"><h3>Content-Security-Policy: what may run?</h3><p>CSP tells the browser which sources of script are allowed, so injected script is ignored.</p><button class="btn a" id="cp0" onclick="csp(0)">No CSP</button><button class="btn" id="cp1" onclick="csp(1)">script-src 'self'</button><button class="btn" id="cp2" onclick="csp(2)">'self' + cdn.trusted.com</button><table id="cpt"></table></div>
<div class="p"><h3>Input validation: allow-list</h3><p>Check type, length, format on the server. Then use parameterized queries so even odd input stays data.</p>Email: <input id="em" class="in" value="ali@example.com" oninput="vl()"><div id="vo" class="box"></div><div class="box mono">db.query("SELECT * FROM users WHERE email = $1", [email])<br><span class=ok>placeholder ≠ string concatenation</span></div></div></div><p><b>Other headers:</b> <span class="mono">X-Content-Type-Options: nosniff</span>, <span class="mono">Referrer-Policy</span>, <span class="mono">Permissions-Policy</span>, <span class="mono">HSTS</span>.</p>`,i(){csp(0);vl()}});
function csp(k){sw(['cp0','cp1','cp2'],k);const S2=[['Inline &lt;script&gt; (injected XSS)',[1,0,0]],['script from evil.com',[1,0,0]],['/app.js (your own server)',[1,1,1]],['cdn.trusted.com/lib.js',[1,0,1]]];$('cpt').innerHTML='<tr><th>Script</th><th>Result</th></tr>'+S2.map((s,j)=>`<tr><td>${s[0]}</td><td>${s[1][k]?(j<2?'<span class=bad>runs ⚠</span>':'<span class=ok>runs ✔</span>'):'<span class=ok>blocked ✔</span>'}</td></tr>`).join('')}
function vl(){const v=$('em').value,ok=/^[^\s@'";<>]{1,64}@[a-z0-9.-]{1,190}\.[a-z]{2,}$/i.test(v);$('vo').innerHTML=ok?'<span class=ok>✔ accepted</span>':`<span class=bad>✖ rejected</span> (not a valid email shape)`}

S.push({p:P2,t:'OWASP Top 10:2025: the most critical web risks',b:`<p class="mu">Click a risk for a plain-language example. Highlighted ones are attacks Member 1 showed.</p><div class="g" id="ow"></div><div class="box" id="owo">Ranking comes from real data on vulnerabilities across thousands of applications.</div>`,i(){const O=[['A01 Broken Access Control','Reading a different user order by changing an ID in the URL.',1],['A02 Security Misconfiguration','Default admin password, open storage bucket, verbose errors.'],['A03 Software Supply Chain Failures','A poisoned npm package or compromised build pipeline.'],['A04 Cryptographic Failures','Passwords stored unhashed, weak or missing TLS.'],['A05 Injection','SQLi, XSS and command injection: untrusted data becomes code.',1],['A06 Insecure Design','No rate limit on password reset: a flaw in the design itself.'],['A07 Authentication Failures','Credential stuffing, weak passwords, no MFA, session fixation.',1],['A08 Software or Data Integrity Failures','Updates or data accepted without verifying signatures.'],['A09 Logging &amp; Alerting Failures','Attack happens, nobody notices because nothing is logged.'],['A10 Mishandling of Exceptional Conditions','Error paths that crash, leak data or fail open.']];$('ow').innerHTML=O.map(o=>`<div class="c" tabindex="0" style="${o[2]?'border-left-color:#ff2e9a':''}" onclick="$('owo').innerHTML='<b class=yl>${o[0]}</b>: ${o[1]}'"><b>${o[0]}</b></div>`).join('')}});

S.push({p:P2,t:'Practical example: securing an e-commerce application',b:`<p class="mu">Click each red dot to apply a control. Watch the risk score drop.</p><div class="row"><div><svg viewBox="0 0 640 250" width="100%" style="max-width:720px"><path d="M80 120H210M300 120H400M470 90L540 40M470 150L540 200" stroke="#2d2557" stroke-width="3"/>${ic('cart',40,85,60)}<text x="30" y="170">Customer</text>${ic('shield',215,85,60,'#9b97c9')}<text x="215" y="170">CDN / WAF</text>${ic('server',400,70,70)}<text x="395" y="170">Shop app</text>${ic('db',540,10,60,'#ffd23f')}<text x="535" y="85">Orders DB</text>${ic('bank',540,170,60,'#35ff9b')}<text x="520" y="245">Payment gateway</text><circle r="6" fill="#19f0ff"><animateMotion dur="3s" repeatCount="indefinite" path="M80 120H210L300 120L400 120"/></circle>
<g id="ho"></g></svg></div><div><div class="bar"><i id="sc" style="width:100%;background:#ff2e9a"></i></div><b id="scr"></b><div class="box" id="eo">Controls applied appear here.</div></div></div>`,i(){window.ec=new Set;ecr()}});
const EC=[[70,95,'HTTPS + HSTS everywhere','Protects login and cart traffic.'],[255,60,'WAF + rate limiting','Blocks floods and common attack patterns.'],[390,50,'Server-side auth + price checks','Stops IDOR and price tampering in the cart.'],[430,200,'Parameterized queries + validation','Kills SQL injection on search and login.'],[580,100,'Least-privilege DB user + encrypted data','A breach exposes less.'],[500,225,'Tokenized payments via gateway (PCI DSS)','Card numbers never touch your server.'],[300,130,'CSP + output encoding + secure cookies','Stops XSS and session theft.'],[130,45,'MFA + logging and alerts','Account takeover and attacks get noticed.']];
function ecr(){$('ho').innerHTML=EC.map((c,k)=>ec.has(k)?`<g style="color:#35ff9b"><use href="#i-shield" x="${c[0]-9}" y="${c[1]-9}" width="18" height="18" class="ic"/></g>`:`<circle class="pls" cx="${c[0]}" cy="${c[1]}" r="8" fill="#ff2e9a" onclick="ect(${k})"/>`).join('');const p=Math.round(100-ec.size/EC.length*100);$('sc').style.width=p+'%';$('sc').style.background=p>50?'#ff2e9a':p>0?'#ffd23f':'#35ff9b';$('scr').textContent='Residual risk: '+p+'%'}
function ect(k){ec.add(k);ecr();$('eo').innerHTML=`<b class=ok>${EC[k][2]}</b><br>${EC[k][3]}`}
S.push({p:P3,t:'Introduction: from today\'s protection to tomorrow\'s cryptography',b:`<div class="row"><div>${who('Adarsh Kumar Gupta','Member 3 · recent trends in cryptosystems')}<p><b>Recap:</b> Member 1 showed how the web is attacked. Member 2 showed the defenses, and the strongest one, <b>HTTPS/TLS</b>, relies on cryptography.</p><p><b>The catch:</b> the TLS handshake agrees keys using <b>RSA and elliptic-curve</b> math. A large quantum computer would break exactly that part. This section is about the new cryptography that replaces and extends it.</p></div><div><svg viewBox="0 0 380 190" width="100%" style="max-width:420px">${ic('browser',10,60,50)}${ic('server',320,60,50)}<path d="M65 85H315" stroke="#35ff9b" stroke-width="3"/><text x="130" y="72" class="m" style="fill:#35ff9b">AES-encrypted session (TLS)</text><rect x="125" y="95" width="130" height="34" rx="6" fill="#120f26" stroke="#ff2e9a" stroke-width="2.5"><animate attributeName="stroke-opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/></rect>${ic('key',130,98,28,'#ffd23f')}<text x="162" y="118" class="m" style="fill:#ff2e9a">RSA / ECDH key exchange</text><text x="95" y="160" style="fill:#ff2e9a">⚠ quantum computers break this step</text></svg></div></div><h3>What we will cover</h3>${AG(['Cryptography and modern cryptosystems','Quantum computing and Shor\'s algorithm','Harvest now, decrypt later','NIST PQC standards, ML-KEM, hybrid','Homomorphic encryption','Zero-knowledge proofs','Multi-party computation','Crypto agility, comparison, conclusion'])}`});
S.push({p:P3,t:'Introduction: cryptography and modern cryptosystems',b:`<div class="row"><div><ul><li>Cryptography turns readable data into protected data using <b>keys</b>.</li><li>Modern systems combine three tools. Web security (HTTPS) uses all of them.</li></ul><svg viewBox="0 0 520 190" width="100%" style="max-width:560px"><text x="10" y="20" style="fill:#ffd23f">Symmetric (AES): one shared key</text>${ic('user',10,28,38)}${ic('key',70,28,38,'#ffd23f')}${ic('user',140,28,38)}<path d="M52 47H70M110 47H138" stroke="#2d2557" stroke-width="2"/>
<text x="260" y="20" style="fill:#ffd23f">Asymmetric (RSA, ECC): key pair</text>${ic('lock',260,28,38,'#19f0ff')}<text x="302" y="52" class="m">public: anyone encrypts</text>${ic('key',260,72,38,'#ff2e9a')}<text x="302" y="96" class="m">private: only owner decrypts</text>
<text x="10" y="150" style="fill:#ffd23f">Hash (SHA-256): fingerprint</text>${ic('doc',10,156,28)}<path d="M44 170H80" stroke="#19f0ff" marker-end="url(#ar)"/><text class="m" x="86" y="174" id="hh">…</text></svg>Hash any text: <input id="hi" class="in" value="hello class" oninput="$('hh').textContent=hx($('hi').value)+'…'"></div>
<div><p class="mu">Why is it changing now? Click a trend.</p>${cards([['Post-quantum cryptography','New math safe from quantum computers','Lattices, hash and code-based schemes replacing RSA/ECC.'],['Homomorphic encryption','Compute on data that stays encrypted','Cloud works on data it cannot read.'],['Zero-knowledge proofs','Prove a fact without revealing it','Used in private identity and blockchain scaling.'],['Multi-party computation','Joint results, private inputs','Banks and hospitals analyse together without sharing raw data.'],['Crypto agility','Swap algorithms without rewriting systems','Essential for the PQC migration.']])}</div></div>`,i(){$('hh').textContent=hx('hello class')+'…'}});

S.push({p:P3,t:'Quantum computing and Shor\'s algorithm',b:`<div class="row"><div><ul><li>A <b>bit</b> is 0 or 1. A <b>qubit</b> can be in a superposition, and measurement collapses it to 0 or 1.</li><li>Quantum computers do not try all keys at once. They exploit interference for special problems.</li><li><b>Shor's algorithm</b> finds factors and discrete logarithms efficiently, which breaks <b>RSA, Diffie-Hellman and elliptic-curve</b> cryptography.</li><li>Grover's algorithm only halves symmetric key strength, so AES-256 and SHA-256 stay fine.</li><li>It needs a large fault-tolerant quantum computer; none exists yet.</li></ul>
<svg viewBox="0 0 340 170" width="100%" style="max-width:360px"><circle cx="90" cy="85" r="60" fill="none" stroke="#2d2557" stroke-width="2"/><text x="82" y="18">|0⟩</text><text x="82" y="165">|1⟩</text><g id="qv"><line x1="90" y1="85" x2="90" y2="30" stroke="#ff2e9a" stroke-width="4" marker-end="url(#ar)"><animateTransform attributeName="transform" type="rotate" from="0 90 85" to="360 90 85" dur="3s" repeatCount="indefinite"/></line></g><text class="m" x="170" y="50">qubit: spinning</text><text class="m" x="170" y="68">between 0 and 1</text><text class="m" x="170" y="120" id="qr">bit: 0 or 1 only</text></svg><button class="btn" onclick="qm()">Measure the qubit</button></div>
<div class="p"><h3>Cost of breaking RSA</h3>Key size: <b id="rb">2048</b> bits <input type="range" min="512" max="8192" step="256" value="2048" id="rs" oninput="rsa()" style="width:60%"><div class="mono">Classical (best, GNFS): <span id="r1"></span><div class="bar"><i id="b1" style="background:#ff2e9a"></i></div>Quantum (Shor): <span id="r2"></span><div class="bar"><i id="b2" style="background:#35ff9b"></i></div></div><p class="mu">Bars show log10(operations). Classical cost explodes; Shor's grows only polynomially (≈ n³ gates).</p></div></div>`,i(){rsa()}});
function qm(){const r=Math.random()<.5;$('qv').innerHTML=`<line x1="90" y1="85" x2="90" y2="${r?30:140}" stroke="#35ff9b" stroke-width="4" marker-end="url(#ar)"/>`;$('qr').textContent='measured: '+(r?'0':'1')+' (state collapsed)';setTimeout(()=>{$('qv').innerHTML='<line x1="90" y1="85" x2="90" y2="30" stroke="#ff2e9a" stroke-width="4" marker-end="url(#ar)"><animateTransform attributeName="transform" type="rotate" from="0 90 85" to="360 90 85" dur="3s" repeatCount="indefinite"/></line>'},2200)}
function rsa(){const b=+$('rs').value,l=b*Math.LN2,c=(1.923*Math.cbrt(l)*Math.pow(Math.log(l),2/3))/Math.LN10,q=Math.log10(b**3);$('rb').textContent=b;$('r1').textContent='≈ 10^'+c.toFixed(0);$('r2').textContent='≈ 10^'+q.toFixed(0);$('b1').style.width=Math.min(100,c/90*100)+'%';$('b2').style.width=Math.min(100,q/90*100)+'%'}

S.push({p:P3,t:'Harvest now, decrypt later (HNDL)',b:`<div class="row"><div><ul><li>Attackers record encrypted traffic <b>today</b> and store it cheaply.</li><li>When a quantum computer arrives, they decrypt the archive.</li><li>So data that must stay secret for many years is already at risk, even though no quantum attack exists yet.</li><li><b>Mosca's rule:</b> if (shelf life x + migration time y) &gt; years until quantum z, you are exposed.</li></ul><div class="p">Data must stay secret (x): <b id="mx"></b> yrs <input type="range" id="sx" min="1" max="30" value="15" oninput="mos()"><br>Time to migrate (y): <b id="my"></b> yrs <input type="range" id="sy" min="1" max="15" value="6" oninput="mos()"><br>Years until quantum (z): <b id="mz"></b> yrs <input type="range" id="sz" min="5" max="30" value="12" oninput="mos()"></div></div><div><svg viewBox="0 0 460 250" width="100%" id="msv"></svg><div class="box" id="mo"></div></div></div>`,i(){mos()}});
function mos(){const x=+$('sx').value,y=+$('sy').value,z=+$('sz').value;$('mx').textContent=x;$('my').textContent=y;$('mz').textContent=z;const k=400/35,r=x+y>z;$('msv').innerHTML=`${ic('hack',10,10,46,'#ff2e9a')}<text x="64" y="38" class="m">records encrypted traffic today</text>${ic('db',10,70,46,'#ffd23f')}<text x="64" y="98" class="m">vault of ciphertext</text>
<text x="10" y="150" class="m">now</text><rect x="40" y="136" width="${y*k}" height="16" fill="#9b97c9"/><rect x="${40+y*k}" y="136" width="${x*k}" height="16" fill="${r?'#ff2e9a':'#35ff9b'}"/><text x="40" y="174" class="m">migrate (y) then data must stay safe (x)</text>
<line x1="${40+z*k}" y1="120" x2="${40+z*k}" y2="200" stroke="#19f0ff" stroke-width="3"/><text x="${Math.min(300,40+z*k-30)}" y="214" class="m" style="fill:#19f0ff">quantum arrives (z)</text>`;$('mo').innerHTML=r?`<span class=bad>x + y = ${x+y} &gt; z = ${z}: data is exposed for about ${x+y-z} years. Start migration now.</span>`:`<span class=ok>x + y = ${x+y} ≤ z = ${z}: migration finishes in time.</span>`}

S.push({p:P3,t:'NIST post-quantum standards, ML-KEM and lattices',b:`<div class="row"><div><svg viewBox="0 0 480 120" width="100%"><line x1="20" y1="60" x2="460" y2="60" stroke="#2d2557" stroke-width="3"/>${[[30,'2016','NIST call'],[150,'2022','4 algorithms chosen'],[270,'Aug 2024','FIPS 203, 204, 205'],[390,'2025','HQC picked as backup KEM']].map(d=>`<circle cx="${d[0]}" cy="60" r="7" fill="#19f0ff"/><text x="${d[0]-18}" y="45" style="fill:#ffd23f">${d[1]}</text><text class="m" x="${d[0]-26}" y="84" style="font-size:10px">${d[2]}</text>`).join('')}</svg>
<table><tr><th>Standard</th><th>Algorithm</th><th>Job</th></tr><tr><td>FIPS 203</td><td><b>ML-KEM</b> (Kyber)</td><td>Key establishment</td></tr><tr><td>FIPS 204</td><td>ML-DSA (Dilithium)</td><td>Digital signatures</td></tr><tr><td>FIPS 205</td><td>SLH-DSA (SPHINCS+)</td><td>Hash-based signatures</td></tr><tr><td>FIPS 206 (draft)</td><td>FN-DSA (Falcon)</td><td>Compact signatures</td></tr></table><h3>Public key size (bytes)</h3><div class="mono">X25519 32<div class="bar"><i style="width:2%"></i></div>RSA-2048 256<div class="bar"><i style="width:21%"></i></div>ML-KEM-768 1184<div class="bar"><i style="width:100%;background:#ff2e9a"></i></div></div><p class="mu">Price of quantum safety: bigger keys and messages.</p></div>
<div><h3>Why lattice math is hard</h3><svg viewBox="0 0 360 300" width="100%" id="lt"></svg><button class="btn a" id="lb1" onclick="lat(0)">Private: short basis</button><button class="btn" id="lb2" onclick="lat(1)">Public: skewed basis</button><div class="box" id="lo"></div></div></div>
<h3>ML-KEM key establishment and hybrid mode</h3><div id="sq4"></div>`,i(){lat(0);if(!$('sq4').innerHTML)mkseq('sq4',{tabs:[
{n:'ML-KEM',actors:[['Alice (client)','user'],['Bob (server)','server']],a:[[0,0,'KeyGen → (pk, sk)',0,'Alice makes a lattice key pair. sk stays secret.'],[0,1,'send public key pk',0,'pk is safe to share.'],[1,1,'Encaps(pk) → (ct, K)',0,'Bob derives a random shared key K and wraps it in ciphertext ct.'],[1,0,'send ciphertext ct',0,'Eavesdroppers see only ct.'],[0,0,'Decaps(sk, ct) → K','g','Alice recovers the same K. Both now use K for AES.']]},
{n:'Hybrid TLS',actors:[['Client','browser'],['Server','server']],a:[[0,1,'key shares: X25519 + ML-KEM',0,'Client offers a classical and a post-quantum key share together.'],[1,0,'X25519 share + ML-KEM ciphertext',0,'Server answers both.'],[0,0,'K = KDF(K_classic ‖ K_pq)','g','Both secrets are combined. An attacker must break BOTH, so you are safe now (classical) and later (quantum).'],[0,1,'🔒 encrypted traffic','g','This is already deployed in major browsers and CDNs.']]}]})}});
function lat(m){sw(['lb1','lb2'],m);const cx=180,cy=150,b1=[46,8],b2=[-10,44],v=m?[[26,96],[16,140]]:[b1,b2],P=[];for(let i=-5;i<=5;i++)for(let j=-5;j<=5;j++){const x=cx+i*b1[0]+j*b2[0],y=cy+i*b1[1]+j*b2[1];if(x>10&&x<350&&y>10&&y<290)P.push([x,y,i,j])}const t=[cx+2*b1[0]+b2[0]+9,cy+2*b1[1]+b2[1]-12],n=cx+2*b1[0]+b2[0],n2=cy+2*b1[1]+b2[1];
$('lt').innerHTML=P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="#9b97c9"/>`).join('')+v.map((a,k)=>`<line x1="${cx}" y1="${cy}" x2="${cx+a[0]}" y2="${cy+a[1]}" stroke="${m?'#ff2e9a':'#35ff9b'}" stroke-width="2.5" marker-end="url(#ar)"/>`).join('')+`<circle cx="${t[0]}" cy="${t[1]}" r="5" fill="#ff2e9a"><animate attributeName="r" values="5;9;5" dur="1.4s" repeatCount="indefinite"/></circle><text x="${t[0]+8}" y="${t[1]-6}" class="m" style="fill:#ff2e9a">noisy point</text>`+(m?`<text x="${n+8}" y="${n2+18}" style="fill:#ffd23f">?</text>`:`<circle cx="${n}" cy="${n2}" r="7" fill="none" stroke="#35ff9b" stroke-width="2.5"/><path d="M${t[0]} ${t[1]}L${n} ${n2}" stroke="#35ff9b" stroke-dasharray="3 3"/>`);
$('lo').innerHTML=m?'<span class=bad>Nearly parallel long vectors: finding the closest lattice point to the noisy point is infeasible (the lattice problem, believed hard even for quantum computers).</span>':'<span class=ok>With the short private basis, the closest lattice point (green ring) is easy to find: that is how the key owner removes the noise.</span>'}

S.push({p:P3,t:'Homomorphic encryption: computing on encrypted data',b:`<div class="row"><div><ul><li>Normally you must decrypt data before processing it. <b>Homomorphic encryption</b> lets a server compute on ciphertext; only the owner can read the result.</li><li>Analogy: a locked glovebox. Bob works inside through gloves but cannot open it.</li></ul><svg viewBox="0 0 380 150" width="100%" style="max-width:400px">${ic('user',10,50,50)}<text x="6" y="118" class="m">Alice</text><rect x="120" y="30" width="170" height="90" rx="8" fill="#0b0919" stroke="#19f0ff" stroke-width="2"/>${ic('lock',180,60,30,'#ffd23f')}<text class="m" x="215" y="80" style="fill:#ffd23f">🔒 7 + 🔒 5</text><circle cx="150" cy="120" r="12" fill="#ff2e9a"/><circle cx="260" cy="120" r="12" fill="#ff2e9a"/>${ic('server',315,45,50,'#9b97c9')}<text x="305" y="118" class="m">Cloud</text><path d="M62 75H118" stroke="#35ff9b" marker-end="url(#ar)" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" values="16;0" dur="1s" repeatCount="indefinite"/></path></svg>
<div class="p"><h3>Toy demo (additive, NOT secure)</h3>A <input type="number" id="ha" value="40" class="in" style="width:80px" oninput="he()"> B <input type="number" id="hb" value="25" class="in" style="width:80px" oninput="he()"><div class="box mono" id="ho2"></div></div></div>
<div><table><tr><th>Type</th><th>Supports</th><th>Examples</th></tr><tr><td>Partial (PHE)</td><td>one operation, unlimited</td><td>RSA (×), Paillier (+)</td></tr><tr><td>Somewhat (SHE)</td><td>both, limited depth (noise grows)</td><td>early BGN</td></tr><tr><td>Fully (FHE)</td><td>any computation</td><td>BFV, BGV, CKKS, TFHE</td></tr></table><p class="mu">FHE is powerful but still 100s to 1000s of times slower than plain computing.</p><h3>Applications</h3>${cards([['Private cloud analytics','Hospital uploads encrypted records','Server returns an encrypted risk score.'],['Private search','Look up without revealing the query','Encrypted database queries.'],['Secure voting + finance','Tally encrypted ballots','Compute on encrypted transactions.'],['Machine learning','Inference on encrypted inputs','Model owner never sees user data.']])}</div></div>`,i(){he()}});
function he(){const k=[317,641],a=+$('ha').value,b=+$('hb').value,ea=(a+k[0])%1000,eb=(b+k[1])%1000,es=(ea+eb)%1000;$('ho2').innerHTML=`Enc(A)=${ea}, Enc(B)=${eb}<br>Server adds ciphertexts: ${es} (never sees ${a} or ${b})<br>Owner decrypts: <span class=ok>${(es-k[0]-k[1]+2000)%1000}</span> = ${a}+${b}`}

S.push({p:P3,t:'Zero-Knowledge Proofs: Ali Baba\'s cave',b:`<div class="row"><div><ul><li>Prove you know a secret <b>without revealing it</b>.</li><li>Three properties: <b>complete</b> (honest prover convinces), <b>sound</b> (cheater fails), <b>zero-knowledge</b> (nothing else leaks).</li><li>Peggy enters the cave and picks left or right. Victor shouts which side she must exit. Without the secret door, she is caught 50% of the time.</li></ul><label><input type="checkbox" id="zk" checked onchange="zn=0;zok=0;zout()"> Peggy knows the secret</label><br><button class="btn" onclick="zrun()">Run a round</button><button class="btn" onclick="zn=0;zok=0;zout()">Reset</button><div class="box" id="zo"></div></div>
<div><svg viewBox="0 0 360 290" width="100%" style="max-width:400px"><path d="M180 270V230M180 230Q60 230 60 130Q60 40 180 40Q300 40 300 130Q300 230 180 230" fill="none" stroke="#2d2557" stroke-width="14"/><line x1="180" y1="40" x2="180" y2="230" stroke="#2d2557" stroke-width="14" stroke-dasharray="0"/><rect x="170" y="125" width="20" height="30" fill="#ffd23f"/><text x="200" y="145" class="m" style="fill:#ffd23f">secret door</text><text x="80" y="30">Path A</text><text x="250" y="30">Path B</text>${ic('user',150,268,30,'#35ff9b')}<text x="190" y="285" class="m">Victor waits outside</text><g id="zd" style="transition:transform .7s;transform:translate(180px,230px)"><circle r="9" fill="#ff2e9a"/></g></svg></div></div>
<h3>Applications</h3>${cards([['Private identity','Prove you are over 18 without showing a birth date','Digital ID wallets.'],['Blockchain','zk-rollups prove thousands of transactions at once','Cheaper, faster, private.'],['Authentication','Prove password knowledge without sending it','Safer logins.'],['Compliance','Prove solvency or a statistic without the data','Audit-friendly privacy.']])}`,i(){zn=0;zok=0;zout()}});
let zn=0,zok=0;function zout(){$('zo').innerHTML=`Rounds: ${zn}, passed: ${zok}<br>Chance a cheater survives all rounds: <b class=bad>1 / ${2**Math.min(zn,40)}</b>`;$('zd').style.transform='translate(180px,230px)'}
function zrun(){const k=$('zk').checked,pick=Math.random()<.5?0:1,ask=Math.random()<.5?0:1,X=[100,260],d=$('zd'),st=[[X[pick]+'px',130],['',0]];d.style.transform=`translate(${X[pick]}px,130px)`;setTimeout(()=>{$('zo').innerHTML=`Peggy hides in path ${pick?'B':'A'}. Victor shouts: “come out of ${ask?'B':'A'}!”`;const same=pick==ask;if(!same&&k)d.style.transform='translate(180px,140px)';setTimeout(()=>{zn++;if(same||k){zok++;d.style.transform=`translate(${X[ask]}px,130px)`;setTimeout(()=>{$('zo').innerHTML=`<span class=ok>Peggy exits the right side${same?' (lucky or honest)':' using the secret door'}.</span><br>Rounds: ${zn}, passed: ${zok}. A cheater survives with chance 1/${2**Math.min(zn,40)}.`;d.style.transform='translate(180px,230px)'},800)}else{$('zo').innerHTML=`<span class=bad>Caught! She could not switch sides.</span> Rounds: ${zn}. A cheater fails about half the time per round.`;d.style.transform='translate(180px,230px)';zn=0;zok=0}},900)},800)}

S.push({p:P3,t:'Multi-Party Computation (MPC)',b:`<div class="row"><div><ul><li>Several parties compute a result together while keeping their <b>inputs private</b>.</li><li>Idea: <b>secret sharing</b>. Each value is split into random shares that look like noise alone; only the sum reveals the answer.</li><li>Used for joint fraud detection, private auctions, and threshold key custody (no single party holds the key).</li></ul><button class="btn" onclick="mp()">Run MPC again</button><div class="box mono" id="mo"></div></div><div><svg viewBox="0 0 380 300" width="100%" style="max-width:420px" id="msvg"></svg></div></div>`,i(){mp()}});
function mp(){const v=[70,90,110],sh=v.map(x=>{const a=Math.random()*100|0,b=Math.random()*100|0;return[a,b,x-a-b]}),P=[[190,20],[40,200],[340,200]],col=['#19f0ff','#ffd23f','#ff2e9a'],sums=[0,1,2].map(j=>sh.reduce((s,r)=>s+r[j],0));let s='';
[[0,1],[1,2],[0,2]].forEach(e=>{s+=`<line x1="${P[e[0]][0]+25}" y1="${P[e[0]][1]+30}" x2="${P[e[1]][0]+25}" y2="${P[e[1]][1]+30}" stroke="#2d2557" stroke-width="2"/>`});
for(let i=0;i<3;i++)for(let j=0;j<3;j++)if(i!=j){const a=P[i],b=P[j];s+=`<circle r="6" fill="${col[i]}"><animateMotion dur="2.4s" repeatCount="indefinite" path="M${a[0]+25} ${a[1]+30}L${b[0]+25} ${b[1]+30}"/></circle>`}
P.forEach((p,i)=>s+=ic('user',p[0],p[1],50,col[i])+`<text x="${p[0]-8}" y="${p[1]+72}" class="m">P${i+1} salary: ${v[i]}</text>`);$('msvg').innerHTML=s;
$('mo').innerHTML=sh.map((r,i)=>`P${i+1} splits ${v[i]} → ${r.join(' + ')}`).join('<br>')+`<br>Each party adds the shares it receives: ${sums.join(', ')}<br><span class=ok>Total ${sums.reduce((a,b)=>a+b)} → average ${sums.reduce((a,b)=>a+b)/3}. No salary was revealed.</span>`}

S.push({p:P3,t:'Comparison, crypto agility and future challenges',b:`<div class="row"><div><table><tr><th></th><th>Goal</th><th>Maturity</th><th>Main cost</th></tr><tr><td>PQC</td><td>Quantum-safe keys + signatures</td><td>Standardized, rolling out</td><td>Larger keys</td></tr><tr><td>FHE</td><td>Compute on ciphertext</td><td>Emerging</td><td>Very slow</td></tr><tr><td>ZKP</td><td>Prove without revealing</td><td>Deployed</td><td>Proving time</td></tr><tr><td>MPC</td><td>Joint private computation</td><td>Deployed</td><td>Network rounds</td></tr></table><p class="mu">Illustrative ratings:</p>${[['PQC',90,40],['FHE',35,95],['ZKP',70,80],['MPC',75,85]].map(r=>`<div class="mono">${r[0]} maturity<div class="bar"><i style="width:${r[1]}%"></i></div>privacy power<div class="bar"><i style="width:${r[2]}%;background:#ff2e9a"></i></div></div>`).join('')}</div>
<div><h3>Crypto agility loop</h3><svg viewBox="0 0 300 250" width="100%" style="max-width:320px"><circle cx="150" cy="120" r="85" fill="none" stroke="#2d2557" stroke-width="2" stroke-dasharray="6 6"/><circle r="8" fill="#19f0ff"><animateMotion dur="8s" repeatCount="indefinite" path="M150 35A85 85 0 1 1 149.9 35"/></circle><text x="118" y="25" style="fill:#ffd23f">1 Inventory</text><text x="215" y="125" style="fill:#ffd23f">2 Prioritize</text><text x="100" y="228" style="fill:#ffd23f">3 Replace (hybrid)</text><text x="2" y="125" style="fill:#ffd23f">4 Verify</text>${ic('chip',125,95,50,'#19f0ff')}</svg>
<ul><li><b>Crypto agility</b>: algorithms are configurable, not hard-coded.</li><li><b>Hybrid</b> classical + PQ during the transition.</li><li><b>Challenges</b>: bigger keys, performance, legacy devices, standards still evolving, implementation side channels.</li></ul><p class="ok"><b>Conclusion:</b> secure the web with today's best practice, and start inventorying and migrating cryptography now. Thank you!</p></div></div>`});
const D=$('deck');S.forEach(s=>{const e=document.createElement('section');e.className='s';e.innerHTML=(s.p?`<div class="part mono">${s.p}</div>`:'')+(s.t?`<h2>${s.t}</h2>`:'')+s.b;D.appendChild(e)});
let cur=-1;const E=[...D.children];
function show(n){n=Math.max(0,Math.min(S.length-1,n));if(n===cur)return;E.forEach((e,k)=>e.className='s'+(k===n?' on':k<n?' out':''));cur=n;E[n].scrollTop=0;E[n].querySelectorAll('.chip').forEach(c=>{c.style.animation='none';c.offsetWidth;c.style.animation=''});if(S[n].i&&!S[n].d){S[n].i()}$('ct').textContent=(n+1)+' / '+S.length;$('bar').style.width=((n+1)/S.length*100)+'%';try{history.replaceState(0,'','#'+(n+1))}catch(e){}}
function go(d){show(cur+d)}
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=='range'&&e.key.startsWith('Arrow'))return;if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp'].includes(e.key))go(-1)});
show((parseInt(location.hash.slice(1))||1)-1);
</script></body></html>
