<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Web Security & Cryptosystem Trends</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #07060f;
            --pn: #120f26;
            --ln: #2d2557;
            --tx: #e8e6ff;
            --mu: #9b97c9;
            --cy: #19f0ff;
            --mg: #ff2e9a;
            --yl: #ffd23f;
            --gn: #35ff9b;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: radial-gradient(ellipse at 20% 0, #1b1040 0, transparent 55%), radial-gradient(ellipse at 90% 100%, #2a0a33 0, transparent 50%), var(--bg);
            color: var(--tx);
            font: 500 18px/1.5 Rajdhani, system-ui, sans-serif;
            overflow: hidden
        }

        body:after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px);
            z-index: 9
        }

        .mono {
            font-family: 'JetBrains Mono', monospace
        }

        #deck {
            position: relative;
            z-index: 1;
            height: 100%;
            perspective: 1400px
        }

        .s {
            position: absolute;
            inset: 0;
            padding: 4vh 5vw 10vh;
            overflow: auto;
            opacity: 0;
            pointer-events: none;
            transform: translateZ(-160px) rotateY(6deg);
            transition: .6s cubic-bezier(.2, .8, .2, 1)
        }

        .s.on {
            opacity: 1;
            pointer-events: auto;
            transform: none
        }

        .s.out {
            transform: translateZ(-160px) rotateY(-6deg)
        }

        .part {
            color: var(--mg);
            font-size: .8rem;
            letter-spacing: .1em
        }

        h1,
        h2 {
            font-weight: 700;
            margin: .1em 0 .3em;
            text-shadow: 0 0 18px rgba(25, 240, 255, .35);
            color: var(--cy)
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 4.6rem);
            line-height: 1.02
        }

        h2 {
            font-size: clamp(1.5rem, 3vw, 2.3rem)
        }

        h3 {
            margin: .2em 0;
            color: var(--yl)
        }

        p,
        li {
            max-width: 64ch;
            margin: .35em 0
        }

        ul {
            padding-left: 1.1em;
            margin: .3em 0
        }

        .mu {
            color: var(--mu)
        }

        .bad {
            color: var(--mg)
        }

        .ok {
            color: var(--gn)
        }

        .yl {
            color: var(--yl)
        }

        .g {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            margin-top: 10px
        }

        .c,
        .p {
            background: var(--pn);
            border: 1px solid var(--ln);
            border-left: 3px solid var(--cy);
            padding: 10px 13px;
            border-radius: 4px;
            transition: .25s
        }

        .c {
            cursor: pointer
        }

        .c:hover,
        .c.a {
            border-color: var(--mg);
            box-shadow: 0 0 22px rgba(255, 46, 154, .25);
            transform: translateY(-3px)
        }

        .c b {
            color: var(--yl)
        }

        .c .d {
            display: none;
            color: var(--mu);
            font-size: .92rem;
            margin-top: 6px
        }

        .c.a .d {
            display: block
        }

        .btn {
            background: transparent;
            color: var(--cy);
            border: 1px solid var(--cy);
            padding: 5px 13px;
            font: inherit;
            cursor: pointer;
            border-radius: 3px;
            margin: 3px 4px 3px 0;
            transition: .2s
        }

        .btn:hover,
        .btn.a {
            background: var(--cy);
            color: #000
        }

        .btn:focus-visible,
        .c:focus-visible {
            outline: 2px solid var(--yl)
        }

        .box {
            background: #0b0919;
            border: 1px solid var(--ln);
            border-radius: 4px;
            padding: 10px;
            margin-top: 8px;
            font-size: .88rem;
            word-break: break-all;
            min-height: 44px
        }

        input.in {
            width: 100%;
            max-width: 480px;
            background: #0b0919;
            border: 1px solid var(--cy);
            color: var(--tx);
            padding: 7px;
            font: .9rem 'JetBrains Mono', monospace;
            border-radius: 3px
        }

        .hl {
            background: rgba(255, 46, 154, .25);
            color: var(--mg)
        }

        .row {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            align-items: flex-start
        }

        .row>* {
            flex: 1 1 320px;
            min-width: 0
        }

        svg text {
            fill: var(--tx);
            font: 600 14px Rajdhani
        }

        svg .m {
            font: 12px 'JetBrains Mono', monospace
        }

        .ic {
            fill: currentColor
        }

        .node {
            fill: var(--pn);
            stroke: var(--cy);
            stroke-width: 1.5
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: .86rem;
            margin: 6px 0
        }

        td,
        th {
            border: 1px solid var(--ln);
            padding: 5px 8px;
            text-align: left
        }

        th {
            color: var(--yl)
        }

        .t3d {
            transform: rotateX(14deg) rotateY(-10deg);
            transform-style: preserve-3d;
            display: inline-block
        }

        .dr {
            stroke-dasharray: 400;
            animation: dr .8s forwards
        }

        @keyframes dr {
            from {
                stroke-dashoffset: 400
            }

            to {
                stroke-dashoffset: 0
            }
        }

        @keyframes pl {
            50% {
                opacity: .35;
                transform: scale(1.4)
            }
        }

        .pls {
            animation: pl 1.4s infinite;
            transform-box: fill-box;
            transform-origin: center;
            cursor: pointer
        }

        @keyframes sh {
            25% {
                transform: translateX(-3px)
            }

            75% {
                transform: translateX(3px)
            }
        }

        .shk {
            animation: sh .2s infinite
        }

        .bar {
            height: 14px;
            background: #0b0919;
            border: 1px solid var(--ln);
            border-radius: 2px;
            overflow: hidden;
            margin: 3px 0
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--cy);
            transition: width .6s
        }

        .pop {
            position: relative;
            background: #0b0919;
            border: 1px solid var(--cy);
            border-radius: 5px;
            overflow: hidden
        }

        .pop .tb {
            background: #1d1840;
            padding: 3px 10px;
            font-size: .78rem;
            color: var(--mu)
        }

        .pop .bd {
            padding: 10px;
            min-height: 110px
        }

        #nav {
            position: fixed;
            z-index: 5;
            left: 0;
            right: 0;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center
        }

        #bar {
            position: fixed;
            z-index: 5;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--mg), var(--cy));
            transition: .4s
        }

        .tag {
            display: inline-block;
            border: 1px solid var(--gn);
            color: var(--gn);
            padding: 0 8px;
            border-radius: 10px;
            font-size: .8rem
        }

        label {
            cursor: pointer
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 6px 0
        }

        .chip {
            border: 1px solid var(--ln);
            background: var(--pn);
            padding: 3px 11px;
            border-radius: 14px;
            font-size: .92rem;
            animation: up .5s both
        }

        .chip b {
            color: var(--mg);
            margin-right: 4px
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(12px)
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important;
                animation: none !important
            }
        }
    </style>
</head>

<body>
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">

    </svg>
    <div id="bar"></div>
    <div id="deck"></div>
    <div id="nav"><button class="btn" onclick="go(-1)" aria-label="Previous">◀</button><span id="ct"
            class="mono mu"></span><button class="btn" onclick="go(1)" aria-label="Next">▶</button></div>
    <script>
        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
        const hx = s => { let h = 5381; for (const c of s) h = (h * 33 ^ c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(8, '0') };
        const ic = (n, x, y, s, c) => `<g style="color:${c || '#19f0ff'}"><use href="#i-${n}" x="${x}" y="${y}" width="${s}" height="${s}" class="ic"/></g>`;
        const cards = a => '<div class="g">' + a.map(x => `<div class="c" tabindex="0" onclick="this.classList.toggle('a')"><b>${x[0]}</b><div>${x[1]}</div><div class="d">${x[2]}</div></div>`).join('') + '</div>';
        const sw = (ids, k) => ids.forEach((d, i) => $(d).className = 'btn' + (i == k ? ' a' : ''));
        // ---------- sequence-diagram engine ----------
        const SQ = {};
        function mkseq(id, C) {
            const st = { ti: 0, df: 0, s: 0, tm: null }; SQ[id] = st;
            function draw(T, M) {
                const A = T.actors, w = 760, g = w / A.length, cx = i => g * (i + .5), h = 100 + M.length * 46; let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:880px">`;
                A.forEach((a, i) => { s += ic(a[1], cx(i) - 22, 4, 44, a[2]) + `<text x="${cx(i)}" y="68" text-anchor="middle">${a[0]}</text><line x1="${cx(i)}" y1="76" x2="${cx(i)}" y2="${h - 4}" stroke="#2d2557" stroke-dasharray="4 4"/>` });
                M.forEach((m, k) => {
                    if (k >= st.s) return; const y = 104 + k * 46, col = { x: '#ff2e9a', b: '#ff2e9a', g: '#35ff9b' }[m[3]] || '#19f0ff', a = cx(m[0]), b = cx(m[1]), nw = k == st.s - 1;
                    if (m[0] == m[1]) s += `<rect x="${a + 10}" y="${y - 17}" width="${Math.min(330, m[2].length * 7.4 + 16)}" height="26" rx="4" fill="#0b0919" stroke="${col}"/><text class="m" x="${a + 18}" y="${y}" style="fill:${col}">${m[2]}</text>`;
                    else { s += `<line x1="${a}" y1="${y}" x2="${b}" y2="${y}" stroke="${col}" stroke-width="2.2" marker-end="url(#ar)" ${nw ? 'class="dr"' : ''}/><text class="m" x="${(a + b) / 2}" y="${y - 8}" text-anchor="middle" style="fill:${col}">${m[2]}</text>`; if (nw) s += `<circle r="6" fill="${col}"><animateMotion dur=".9s" fill="freeze" path="M${a} ${y}L${b} ${y}"/></circle>`; if (m[3] == 'x') s += `<text x="${b}" y="${y + 8}" text-anchor="middle" style="fill:#ff2e9a;font-size:24px">✖</text>` }
                }); return s + '</svg>'
            }
            function ui() {
                const T = C.tabs[st.ti], M = st.df && T.d ? T.d : T.a, cur = M[st.s - 1];
                $(id).innerHTML = `${C.tabs.length > 1 ? `<div>${C.tabs.map((t, i) => `<button class="btn${i == st.ti ? ' a' : ''}" data-t="${i}">${t.n}</button>`).join('')}</div>` : ''}<div>${T.d ? `<button class="btn${st.df ? ' a' : ''}" data-d>🛡 ${T.dn || 'Defense'}: ${st.df ? 'ON' : 'OFF'}</button>` : ''}<button class="btn" data-s>Next step ▶</button><button class="btn" data-p>Auto-play</button><button class="btn" data-r>Reset</button></div>${draw(T, M)}<div class="box">${cur ? (cur[4] || '') : T.c || 'Press “Next step” to walk through it.'}</div>`;
            }
            $(id).onclick = e => {
                const b = e.target.closest('button'); if (!b) return; const T = C.tabs[st.ti], M = st.df && T.d ? T.d : T.a; clearInterval(st.tm);
                if (b.dataset.t != null) { st.ti = +b.dataset.t; st.s = 0; st.df = 0 } else if ('d' in b.dataset) { st.df = 1 - st.df; st.s = 0 } else if ('s' in b.dataset) st.s = Math.min(M.length, st.s + 1); else if ('r' in b.dataset) st.s = 0;
                else if ('p' in b.dataset) { st.s = 0; st.tm = setInterval(() => { if (st.s >= M.length) return clearInterval(st.tm); st.s++; ui() }, 1500) } ui()
            }; ui()
        }
        const AG = a => '<div class="chips">' + a.map((x, k) => `<span class="chip" style="animation-delay:${k * .12}s"><b>${k + 1}</b> ${x}</span>`).join('') + '</div>';
        const who = (n, r) => `<div style="display:flex;align-items:center;gap:12px;margin:4px 0"><svg viewBox="0 0 48 48" width="52" height="52">${ic('user', 0, 0, 48, '#ff2e9a')}</svg><div><div style="font-size:1.7rem;font-weight:700;color:#fff">${n}</div><div class="mu">${r}</div></div></div>`;
        const P1 = 'Member 1 · Rahul · Web security fundamentals and attacks', P2 = 'Member 2 · Adarsh Kumar · Secure communication and protection', P3 = 'Member 3 · Adarsh Kumar Gupta · Recent trends in cryptosystems';
        const S = [];
        S.push({
            p: '', t: '', b: `<div class="row" style="align-items:center;margin-top:6vh"><div><span class="part mono">class presentation</span><h1><span class="t3d">Web Security</span><br>and the Future of Cryptography</h1><p class="mu">How websites get attacked, how HTTPS and good engineering protect them, and why cryptography is being rebuilt for the quantum era.</p><p><span class="tag">Rahul · Attacks</span> <span class="tag">Adarsh Kumar · Protection</span> <span class="tag">Adarsh Kumar Gupta · Cryptosystems</span></p><p class="mu mono">Use → / ← or the buttons. Click everything: most slides are interactive.</p></div>
<svg viewBox="0 0 360 300" width="100%" style="max-width:420px">${ic('shield', 120, 60, 120, '#19f0ff')}${ic('lock', 40, 170, 70, '#ff2e9a')}${ic('key', 250, 180, 70, '#ffd23f')}${ic('hack', 260, 40, 60, '#9b97c9')}<circle cx="180" cy="120" r="100" fill="none" stroke="#2d2557" stroke-dasharray="6 8"><animateTransform attributeName="transform" type="rotate" from="0 180 120" to="360 180 120" dur="24s" repeatCount="indefinite"/></circle><circle cx="180" cy="20" r="6" fill="#19f0ff"><animateTransform attributeName="transform" type="rotate" from="0 180 120" to="360 180 120" dur="8s" repeatCount="indefinite"/></circle></svg></div>`
        });

        S.push({ p: P1, t: 'Introduction: Web Security Fundamentals and Attacks', b: `<div class="row"><div>${who('Rahul', 'Member 1 · introduces web security and the attacks on the web')}<ul><li><b>Web security</b> is the practice of protecting websites, web applications, APIs and their users from attack and misuse.</li><li>Every site is reachable by anyone, so every request has to be treated as potentially hostile.</li><li>In this part we see <b>why it matters</b>, <b>how a web request works</b>, and <b>how attackers break in</b>. Member 2 then shows how we stop them.</li></ul></div><div><h3>What we will cover</h3>${AG(['Why web security matters', 'Goals: the CIA triad', 'Architecture: where attacks land', 'Man-in-the-Middle attacks', 'SQL Injection', 'Cross-Site Scripting (XSS)', 'Broken Access Control', 'Prevention and summary'])}</div></div>` });
        S.push({
            p: P1, t: 'Why web security matters', b: `<div class="row"><div><ul><li>Web applications hold passwords, payments and identities, so <b>attackers go there first</b>.</li><li>Even the biggest companies are hit. Click a card to see what actually went wrong.</li></ul><div class="g"><div class="c" tabindex="0" onclick="this.classList.toggle('a')"><b class="mono" style="font-size:1.9rem"><span class="cn" data-v="22">0</span> crore ₹</b><div>Average data breach cost in India, IBM 2025 (up 13%, a record)</div><div class="d">Cost covers investigation, downtime, legal and lost customers.</div></div><div class="c" tabindex="0" onclick="this.classList.toggle('a')"><b class="mono" style="font-size:1.9rem"><span class="cn" data-v="29">0</span> million</b><div>Meta (Facebook), 2018</div><div class="d">Bugs in one profile feature let attackers steal login tokens and access user data.</div></div><div class="c" tabindex="0" onclick="this.classList.toggle('a')"><b class="mono" style="font-size:1.9rem"><span class="cn" data-v="100">0</span> million</b><div>Capital One, 2019</div><div class="d">A misconfigured web application firewall relayed attacker requests to internal cloud resources.</div></div></div></div>
